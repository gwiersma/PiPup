plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'nl.rogro82.pipup'
    compileSdk 34

    defaultConfig {
        applicationId "nl.rogro82.pipup"
        // 26: TYPE_APPLICATION_OVERLAY and notification channels without fallbacks.
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.2.0-gwiersma"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug key, as the other self-built apps on the box: replace with your own key for a wider release.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // The only third-party library left. JSON comes from the platform (org.json), images are decoded by hand.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
